[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-desk"
version = "1.0.0"
description = "An eight-agent rule engine for on-chain risk analysis. Seven rules propose, one vetoes. Read-only."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ventry089" }]
keywords = ["risk-management", "rule-engine", "agents", "multi-agent", "on-chain", "data-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.20"]

[project.urls]
Homepage = "https://github.com/ventry089/warden-desk"
Issues = "https://github.com/ventry089/warden-desk/issues"
Rules = "https://github.com/ventry089/warden-desk/blob/main/rules.json"

[project.scripts]
warden-desk = "desk:cli"

[tool.setuptools]
packages = ["agents", "core"]
py-modules = ["desk"]

[tool.setuptools.package-data]
"*" = ["rules.json", "data/*.sqlite", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "RUF001",  # the desk prints ·, ✓, ✗ and — those are deliberate
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
